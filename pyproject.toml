[project]
name = "ycon"
version = "0.1.2"
description = "Python module to manage YAML configuration files."
readme = "README.md"
authors = [
    { name = "Ansgar Kellner", email = "keans@gmx.de" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
signing = ["pynacl>=1.5.0"]

[project.scripts]
ycon = "ycon.cli:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pynacl>=1.5.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.7",
]

[tool.ruff]
line-length = 79
